# Benchmark-only configuration: all three Qwen3-Omni stages share one
# physical GPU and each stage admits up to 128 active sequences.  This is
# intentionally different from a 128-request workload over the default
# max_num_seqs=64 configuration, which executes as two waves.

base_config: qwen3_omni_moe.yaml

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 128
    max_num_batched_tokens: 32768
    gpu_memory_utilization: 0.35
    enforce_eager: true
    async_scheduling: false
    engine_args:
      speculative_config:
        method: dspark
        model: /mnt/minecraft/model/Qwen3-Omni-30B-A3B-Instruct-dspark-thinker-image-l5-aux5-v1/2
        num_speculative_tokens: 7
        draft_tensor_parallel_size: 1

  - stage_id: 1
    devices: "0"
    max_num_seqs: 128
    max_num_batched_tokens: 32768
    gpu_memory_utilization: 0.10
    default_sampling_params:
      temperature: 0.9
      max_tokens: 512
      seed: 0

  - stage_id: 2
    devices: "0"
    max_num_seqs: 128
    max_num_batched_tokens: 65536
    gpu_memory_utilization: 0.05
